<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gradcon Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Gradcon Register — contractors, suppliers, consultants and clients, one
 * editable list shared through the cloud (estimator_kv row `gradcon-register`).
 * Palette = the portal shell's (charcoal #231f20, lime #d5de5d, Inter). */
:root{ --bg:#fafafa; --surface:#fff; --surface-2:#f3f3f1; --text:#231f20; --muted:#6b6b6b; --muted-2:#8d8d8d; --line:#e2e2e2; --line-soft:#ececec; --accent:#d5de5d; --accent-hover:#c6d045; --accent-ink:#1c1c1c; --accent-text:#6b7416; --ok:#1a7a3c; --ok-bg:#e6f4ea; --warn:#b26a00; --warn-bg:#fff4e0; --bad:#b42318; --bad-bg:#fdecea; --info:#1f5f9e; --info-bg:#e8f1fb; --radius:12px; }
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;}
header{background:var(--text);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;}
header h1 b{color:var(--accent);font-weight:800;}
header .subtitle{font-size:11.5px;opacity:.78;max-width:720px;margin-top:2px;}
header .meta{font-size:11px;opacity:.85;text-align:right;line-height:1.5;}
header .meta .cloud.err{color:#ffb4a8;} header .meta .cloud.ok{color:#cfe8c9;}
#tabnav{display:flex;gap:2px;background:#1a1718;padding:0 14px;overflow-x:auto;}
.tab-btn{background:transparent;border:none;color:#bdb9ba;padding:11px 14px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn:hover{color:#fff;} .tab-btn.active{color:#fff;border-bottom-color:var(--accent);}
.tab-btn .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:#3a3536;font-size:10.5px;text-align:center;}
#main{padding:16px 18px 60px;max-width:1900px;margin:0 auto;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;cursor:pointer;}
.kpi:hover{border-color:var(--text);} .kpi.on{outline:2px solid var(--text);}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;} .kpi .v{font-size:20px;font-weight:800;margin-top:2px;} .kpi .s{font-size:11px;color:var(--muted);}
.kpi.bad{border-left-color:var(--bad);} .kpi.warn{border-left-color:var(--warn);} .kpi.ok{border-left-color:var(--ok);}
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.row .grow{flex:1 1 220px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;} .chips .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;}
.chip:hover{border-color:var(--text);} .chip.on{background:var(--text);border-color:var(--text);color:#fff;} .chip .n{opacity:.6;font-weight:500;margin-left:4px;}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=email],select,textarea{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent-hover);}
textarea{width:100%;min-height:54px;resize:vertical;}
.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap;}
.btn:hover{border-color:var(--text);} .btn:disabled{opacity:.45;cursor:default;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);} .btn.primary:hover{background:var(--accent-hover);}
.btn.danger{color:var(--bad);border-color:#f1c4bd;} .btn.danger:hover{background:var(--bad-bg);}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px;}
table.reg{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table.reg th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;}
table.reg th.on{color:var(--text);} table.reg th.num,table.reg td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.reg td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
table.reg tr.org{cursor:pointer;} table.reg tr.org:hover td{background:#fcfdf3;} table.reg tr.org.open td{background:#f7f8ea;border-bottom-color:transparent;}
table.reg tr.detail td{background:#fbfbf7;padding:0 10px 14px;}
.name{font-weight:700;font-size:13.5px;} .name .site{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:6px;}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tier{display:inline-block;min-width:20px;text-align:center;font-weight:800;font-size:11px;border-radius:5px;padding:1px 5px;margin-right:6px;background:#eee;color:#555;}
.tier.A{background:var(--ok-bg);color:var(--ok);} .tier.B{background:var(--info-bg);color:var(--info);} .tier.C{background:var(--warn-bg);color:var(--warn);} .tier.D{background:#f0f0f0;color:#777;}
.stars{color:#c9a400;letter-spacing:1px;font-size:12px;} .stars .off{color:#d8d8d8;}
.stars button{background:none;border:none;padding:0;font:inherit;cursor:pointer;color:inherit;font-size:16px;line-height:1;}
.cat{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}
.cat.subcontractor{background:#e8f1fb;color:#1f5f9e;border-color:#cfe0f3;} .cat.supplier{background:#eef7ea;color:#2b6a2f;border-color:#d3e8cf;} .cat.builder{background:#fdf1e3;color:#9a5b00;border-color:#f3dcb8;} .cat.client{background:#f6ecfa;color:#6b3fa0;border-color:#e4d2ee;} .cat.consultant{background:#eaf5f6;color:#116a74;border-color:#cbe5e8;} .cat.service{background:#f2f2f2;color:#555;}
.cap{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin:2px 3px 0 0;border:1px solid var(--line);background:#fff;color:var(--muted);}
.cap.yes{background:var(--ok-bg);color:var(--ok);border-color:#bfe0c7;} .cap.no{background:var(--bad-bg);color:var(--bad);border-color:#f1c4bd;text-decoration:line-through;text-decoration-color:rgba(180,35,24,.45);} .cap.unknown{background:#f6f6f6;color:#888;border-style:dashed;}
.when{white-space:nowrap;font-variant-numeric:tabular-nums;} .when .ago{display:block;font-size:11px;} .when.fresh .ago{color:var(--ok);} .when.aging .ago{color:var(--warn);} .when.stale .ago{color:var(--bad);font-weight:700;}
.ball{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-top:3px;} .ball.them{background:var(--info-bg);color:var(--info);} .ball.gradcon{background:var(--warn-bg);color:var(--warn);}
.score{font-weight:800;font-variant-numeric:tabular-nums;} .score small{font-weight:500;color:var(--muted);}
.status{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;} .status.Active{background:var(--ok-bg);color:var(--ok);} .status.Prospect{background:var(--info-bg);color:var(--info);} .status.Inactive{background:#efefef;color:#777;} .status.Do-not-use{background:var(--bad-bg);color:var(--bad);}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding-top:12px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.card h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card.wide{grid-column:1 / -1;}
.fld{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;align-items:center;margin-bottom:6px;} .fld label{font-size:11.5px;color:var(--muted);} .fld input,.fld select{width:100%;}
.fld.col{grid-template-columns:1fr;} 
table.inner{width:100%;border-collapse:collapse;font-size:12.5px;} table.inner th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);} table.inner td{padding:3px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle;} table.inner input,table.inner select{width:100%;padding:4px 6px;font-size:12px;}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 12px;} .capgrid .c{display:grid;grid-template-columns:1fr 110px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-soft);} .capgrid .c .l{font-size:12.5px;} .capgrid .c .e{grid-column:1 / -1;font-size:11px;color:var(--muted);font-style:italic;} .capgrid .g{grid-column:1 / -1;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px;}
.capgrid select.yes{background:var(--ok-bg);color:var(--ok);border-color:#bfe0c7;} .capgrid select.no{background:var(--bad-bg);color:var(--bad);border-color:#f1c4bd;}
.threads li{margin:2px 0;font-size:12px;} .threads a{color:var(--info);text-decoration:none;} .threads a:hover{text-decoration:underline;} .threads .d{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;}
.basis{font-size:11.5px;color:var(--muted);line-height:1.5;}
.matrix{margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
.matrix h3{margin:0 0 4px;font-size:13.5px;} .matrix p{margin:0 0 8px;font-size:11.5px;color:var(--muted);}
.matrix table{border-collapse:collapse;width:100%;} .matrix th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line);} .matrix th:first-child,.matrix td:first-child{text-align:left;} .matrix td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line-soft);font-weight:700;}
.matrix td.yes{color:var(--ok);background:var(--ok-bg);} .matrix td.no{color:var(--bad);background:var(--bad-bg);} .matrix td.unknown{color:#999;}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);}
.note{background:var(--info-bg);border:1px solid #cfe0f3;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px;}
.note.warn{background:var(--warn-bg);border-color:#f3dcb8;}
.log li{font-size:12px;margin:2px 0;} .log .d{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;}
.method h3{margin:14px 0 4px;font-size:14px;} .method p,.method li{font-size:12.5px;max-width:900px;} .method code{background:var(--surface-2);padding:1px 5px;border-radius:4px;}
.flash{animation:flash 1.4s ease-out;} @keyframes flash{0%{box-shadow:0 0 0 4px var(--accent);}100%{box-shadow:0 0 0 0 transparent;}}
.muted{color:var(--muted);} .small{font-size:11.5px;} .right{text-align:right;} .nowrap{white-space:nowrap;}
.progress{font-size:11.5px;color:var(--muted);}
.compose{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;} .compose textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:260px;font-size:12px;line-height:1.45;} .compose .subject{width:100%;font-weight:700;} .compose .to{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;} .compose .ok{color:var(--ok);font-weight:700;} .compose .bad{color:var(--bad);font-weight:700;}
@media (max-width:900px){ table.reg th.hide-sm,table.reg td.hide-sm{display:none;} .fld{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <div>
    <h1><b>Gradcon</b> Register</h1>
    <div class="subtitle">Contractors, suppliers, consultants and clients — who does what, who you last spoke to and when, and how the correspondence has gone. Every field is editable; the register is shared across every device through the cloud.</div>
  </div>
  <div class="meta"><div id="userLine"></div><div class="cloud" id="cloudLine">Loading…</div></div>
</header>
<nav id="tabnav">
  <button class="tab-btn active" data-tab="supply">Supply chain <span class="n" id="n-supply"></span></button>
  <button class="tab-btn" data-tab="client">Clients <span class="n" id="n-client"></span></button>
  <button class="tab-btn" data-tab="all">Everyone <span class="n" id="n-all"></span></button>
  <button class="tab-btn" data-tab="people">People <span class="n" id="n-people"></span></button>
  <button class="tab-btn" data-tab="followups">Follow-ups <span class="n" id="n-follow"></span></button>
  <button class="tab-btn" data-tab="method">How this register works</button>
</nav>
<main id="main"></main>

<script src="register-seed.js"></script>
<script>
/* ============================ constants ============================ */
const SUPABASE_URL = "https://xbmyhvrcuyapoarmchpv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Kr4dTFXhZsifAA28HmMAVQ_EDSR2DL0";
const KEY = "gradcon-register";
const API_BASE = /^https?:/.test(location.origin) ? location.origin : "";
const MAILBOX = "projects@gradcon.com.au";
const CATEGORIES = [
  { key: "subcontractor", label: "Subcontractor", side: "supply", blurb: "trades that work for Gradcon — piling, formwork, pumping, finishing, PT, waterproofing" },
  { key: "supplier", label: "Supplier", side: "supply", blurb: "concrete, reinforcement, foams, consumables, plant" },
  { key: "consultant", label: "Consultant", side: "supply", blurb: "engineers, architects, detailers, geotech" },
  { key: "service", label: "Service", side: "supply", blurb: "estimating services, software, platforms" },
  { key: "builder", label: "Client · builder", side: "client", blurb: "head contractors and builders who send Gradcon tenders and packages" },
  { key: "client", label: "Client · owner / developer", side: "client", blurb: "private clients, developers, owner-builders" },
  { key: "other", label: "Unclassified", side: "other", blurb: "not yet placed — set the category" },
];
const CAT = Object.fromEntries(CATEGORIES.map((c) => [c.key, c]));
const STATUSES = ["Active", "Prospect", "Inactive", "Do not use"];
const PILING_KEYS = ["screw", "bored", "cfa", "retention", "shotcrete", "capping"];
const CAPS = (typeof REGISTER_CAPABILITIES !== "undefined") ? REGISTER_CAPABILITIES : [];
const TRADE_GROUPS = (typeof REGISTER_TRADE_GROUPS !== "undefined") ? REGISTER_TRADE_GROUPS : [];
const TG = Object.fromEntries(TRADE_GROUPS.map((g) => [g.key, g.label]));
const CAP = Object.fromEntries(CAPS.map((c) => [c.key, c]));

/* ============================ helpers ============================ */
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysSince = (day) => { if (!day) return null; const t = Date.parse(day + "T00:00:00"); return Number.isFinite(t) ? Math.floor((Date.now() - t) / 864e5) : null; };
const fmtDay = (day) => { if (!day) return "—"; const d = new Date(day + "T00:00:00"); return Number.isFinite(+d) ? d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" }) : day; };
const agoLabel = (n) => n == null ? "" : n === 0 ? "today" : n === 1 ? "yesterday" : n < 30 ? n + " days ago" : n < 365 ? Math.round(n / 30) + " mo ago" : (n / 365).toFixed(1) + " yrs ago";
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slug = (s) => String(s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48);
function portalSignedInUser(){ try{ const s = JSON.parse(localStorage.getItem("gradcon-portal-session") || "null"); return s && typeof s.currentUser === "string" && s.currentUser ? s.currentUser : null; }catch(e){ return null; } }
const userKey = () => { const u = portalSignedInUser(); return u ? u.split("@")[0].toLowerCase() : "unknown"; };
const gmailLink = (id) => "https://mail.google.com/mail/u/?authuser=" + encodeURIComponent(MAILBOX) + "#all/" + encodeURIComponent(id);
const gmailSearch = (q) => "https://mail.google.com/mail/u/?authuser=" + encodeURIComponent(MAILBOX) + "#search/" + encodeURIComponent(q);
const GENERIC = /^(bigpond\.com|bigpond\.net\.au|gmail\.com|outlook\.com|outlook\.com\.au|hotmail\.com|icloud\.com|yahoo\.com|yahoo\.com\.au|live\.com\.au)$/i;
const mailQueryFor = (o) => { const doms = [...new Set((o.emails || []).map((e) => e.split("@")[1]).filter((d) => d && !GENERIC.test(d)))]; const exact = (o.emails || []).filter((e) => GENERIC.test(e.split("@")[1] || "")); const parts = doms.map((d) => "@" + d).concat(exact); return parts.length ? "{" + parts.map((p) => "from:" + p + " to:" + p + " cc:" + p).join(" ") + "}" : ""; };
const tierOf = (score) => score >= 80 ? "A" : score >= 60 ? "B" : score >= 40 ? "C" : "D";
const sideOf = (o) => (CAT[o.category] || CAT.other).side;
const csvCell = (v) => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function downloadCsv(name, header, rows){ const txt = [header, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ============================ state & cloud ============================ */
let STATE = null;            // {version, orgs, tombstones, log, updatedAt, updatedBy}
let RECONCILED = false;      // this tab has read the cloud row (or a positive "no row") — only then may it write
let SYNCED_AT = null;        // updated_at of the cloud row this tab last agreed with
let cloudState = "checking";
let MAIL = null; // /api/google-auth status: {configured, connected, send}
const COMPOSE = {}; // orgId → {contactIdx, subject, text, approved, status, error}
const UI = { tab: "supply", q: "", cats: new Set(), trades: new Set(), cap: "", capState: "yes", tier: "", status: "", sort: "last-desc", open: new Set(), more: new Set(), allCaps: new Set(), kpi: "", checking: null };
const SEED_VERSION = (typeof REGISTER_SEED !== "undefined" && REGISTER_SEED && REGISTER_SEED.version) || 1;
const SEED_BY_ID = Object.fromEntries(((typeof REGISTER_SEED !== "undefined" && REGISTER_SEED && REGISTER_SEED.orgs) || []).map((o) => [o.id, o]));
const familyOf = (o) => { const g = TRADE_GROUPS.find((t) => t.key === (o.tradeGroup || "")); return g ? g.capGroups || [] : []; };

// The mailbox-mined capabilities (by: "mail") and the unstated placeholders (by: "seed") follow the
// seed's rules; a capability Grady set himself is never touched. Runs once per seed version
// (v2, 23 Oct 2026: a foam supplier had been tagged "screed", a piler "reo" — mining is now
// limited to the contractor's own trade family).
function resyncSeedCapabilities(state){
  if ((state.seedVersion || 1) >= SEED_VERSION) return false;
  let n = 0;
  for (const o of state.orgs) {
    const seed = SEED_BY_ID[o.id]; if (!seed) continue;
    const next = {};
    for (const [k, v] of Object.entries(o.capabilities || {})) if (v && v.by !== "mail" && v.by !== "seed") next[k] = v;
    for (const [k, v] of Object.entries(seed.capabilities || {})) if (!next[k]) next[k] = v;
    if (JSON.stringify(next) !== JSON.stringify(o.capabilities || {})) { o.capabilities = next; o.updatedAt = nowIso(); o.updatedBy = "seed v" + SEED_VERSION; n++; }
    if (!o.tradeGroup && seed.tradeGroup) o.tradeGroup = seed.tradeGroup;
  }
  state.seedVersion = SEED_VERSION;
  state.log.push({ at: nowIso(), by: userKey(), text: "Capabilities re-read from the built-in seed v" + SEED_VERSION + " on " + n + " organisation(s) — only mailbox-read and unstated entries; hand-set ones kept" });
  return true;
}
function blankState(){ return { version: 1, orgs: [], tombstones: [], log: [], updatedAt: nowIso(), updatedBy: userKey() }; }
function seedState(){ const s = blankState(); s.seedVersion = SEED_VERSION; const seed = (typeof REGISTER_SEED !== "undefined" && REGISTER_SEED) ? REGISTER_SEED : { orgs: [] }; s.orgs = JSON.parse(JSON.stringify(seed.orgs || [])); s.log.push({ at: nowIso(), by: userKey(), text: "Register seeded with " + s.orgs.length + " organisations (projects@ mailbox, the 23 Oct 2026 workbook and the Project Management register)" }); return s; }

let saveTimer = null, pushing = false, pushAgain = false;

function getPath(o, path){ return path.split(".").reduce((c, k) => (c == null ? undefined : c[k]), o); }
const LOGGED_FIELDS = { category: "category", status: "status", rating: "rating", name: "name", trade: "trade", "followUp.date": "follow-up date", "compliance.publicLiability": "public liability", "compliance.workersComp": "workers comp", "compliance.abn": "ABN" };

  const o = { id: "org-" + uid(), name: "", category: category || "subcontractor", tradeGroup: "", trade: "", website: "", abn: "", address: "", phones: [], emails: [], status: "Active", rating: 0, projects: [], threads: [], notes: "", evidence: "", risks: "", lastContact: "", lastContactDir: "", lastMailId: "", firstContact: "", inbound: 0, outbound: 0, threadCount: 0, medianReplyHrs: null, score: 0, tier: "D", scoreBasis: "Added by hand — no correspondence read yet", compliance: {}, capabilities: {}, contacts: [], followUp: {}, sources: ["added by " + userKey()], confidence: "", createdAt: nowIso(), updatedAt: nowIso(), updatedBy: userKey(), side: (CAT[category] || CAT.subcontractor).side };

/* ============================ mail check (read-only, on demand) ============================ */
async function checkMail(o){
  const q = mailQueryFor(o); if (!q) return { error: "no email address on file" };
  try {
    const res = await fetch(API_BASE + "/api/gmail", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "list", q, max: 8 }), signal: AbortSignal.timeout(30000) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) return { error: d.error || ("HTTP " + res.status) };
    const msgs = (d.messages || []).filter((m) => !(m.labels || []).includes("DRAFT"));
    if (!msgs.length) return { none: true };
    msgs.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const newest = msgs[0]; const day = String(newest.date).slice(0, 10); const out = /@gradcon\.com\.au/i.test(newest.from || "");
    let moved = false;
    if (!o.lastContact || day > o.lastContact) { o.lastContact = day; o.lastContactDir = out ? "out" : "in"; o.lastMailId = newest.id; moved = true; }
    for (const m of msgs) { const subj = String(m.subject || "").replace(/^((re|fw|fwd)\s*:\s*)+/i, "").trim(); if (subj && !o.threads.some((t) => t.threadId === m.threadId || t.subject.toLowerCase() === subj.toLowerCase())) o.threads.unshift({ subject: subj, day: String(m.date).slice(0, 10), threadId: m.threadId }); }
    o.threads.sort((a, b) => b.day.localeCompare(a.day)); o.threads = o.threads.slice(0, 12);
    o.mailCheckedAt = nowIso(); touch(o); if (moved) log(o, "Last contact moved to " + fmtDay(day) + " by a mailbox check"); save();
    return { ok: true, moved, day, subject: newest.subject };
  } catch (e) { return { error: e.message || "failed" }; }
}
async function checkAll(list){

  const c = UI.checking; UI.checking = null; render(); alert("Mailbox check finished: " + c.done + " checked, " + c.moved + " last-contact date(s) moved" + (c.errors ? ", " + c.errors + " could not be read" : "") + ".");
}

/* ============================ filtering ============================ */
function visibleOrgs(){
  let list = STATE.orgs.slice();
  if (UI.tab === "supply" || UI.tab === "client") list = list.filter((o) => sideOf(o) === UI.tab);
  if (UI.cats.size) list = list.filter((o) => UI.cats.has(o.category));
  if (UI.trades.size) list = list.filter((o) => UI.trades.has(o.tradeGroup || "other"));
  // a chosen capability shows ONLY organisations with something recorded for it: "does" (default), "does NOT",
  // "not stated" (a piling contractor who has not said), or "stated either way" — never the whole list
  // one capability chip = ONLY the organisations recorded as DOING it (Grady, 23 Oct 2026: "if screw piles
  // clicked, only screw piles contractors should appear and not this multi choice filtering")
  if (UI.cap) list = list.filter((o) => o.capabilities[UI.cap] && o.capabilities[UI.cap].status === "yes");
  if (UI.tier) list = list.filter((o) => o.tier === UI.tier);
  if (UI.status) list = list.filter((o) => o.status === UI.status); else list = list.filter((o) => o.status !== "Inactive" && o.status !== "Do not use" || UI.kpi === "all");
  if (UI.kpi === "them") list = list.filter((o) => o.lastContactDir === "out" && (daysSince(o.lastContact) || 0) >= 3);
  if (UI.kpi === "gradcon") list = list.filter((o) => o.lastContactDir === "in" && (daysSince(o.lastContact) || 0) >= 3);
  if (UI.kpi === "stale") list = list.filter((o) => (daysSince(o.lastContact) ?? 9999) > 90);
  if (UI.kpi === "fresh") list = list.filter((o) => (daysSince(o.lastContact) ?? 9999) <= 30);
  if (UI.kpi === "unclassified") list = list.filter((o) => o.category === "other" || o.confidence === "low");
  if (UI.q) { const q = UI.q.toLowerCase(); list = list.filter((o) => [o.name, o.trade, o.notes, o.risks, o.evidence, o.address, o.abn, ...(o.emails || []), ...(o.phones || []), ...(o.projects || []), ...(o.contacts || []).flatMap((c) => [c.name, c.role, c.email, c.phone, c.mobile]), ...(o.threads || []).map((t) => t.subject)].join(" ").toLowerCase().includes(q)); }
  const by = { "last-desc": (a, b) => (b.lastContact || "").localeCompare(a.lastContact || ""), "last-asc": (a, b) => (a.lastContact || "9").localeCompare(b.lastContact || "9"), score: (a, b) => b.score - a.score, name: (a, b) => a.name.localeCompare(b.name), reply: (a, b) => (a.medianReplyHrs ?? 1e9) - (b.medianReplyHrs ?? 1e9), rating: (a, b) => (b.rating - a.rating) || (b.score - a.score), follow: (a, b) => ((a.followUp && a.followUp.date) || "9").localeCompare((b.followUp && b.followUp.date) || "9") };
  list.sort(by[UI.sort] || by["last-desc"]);
  if (UI.pinTop) { const i = list.findIndex((o) => o.id === UI.pinTop); if (i > 0) list.unshift(list.splice(i, 1)[0]); }
  return list;
}

  if (UI.tab === "people") { main.innerHTML = renderPeople(); return; }

  const list = visibleOrgs();

    block("Ball with Gradcon", "Their email is the last one in the thread and it has sat 3+ days — a quote received, a question asked, a tender issued.", us, (o) => "they wrote " + fmtDay(o.lastContact) + " · " + agoLabel(daysSince(o.lastContact)) + (o.threads[0] ? ' · <span class="muted">' + esc(o.threads[0].subject) + "</span>" : "")) +
    block("Waiting on them", "Gradcon wrote last and nothing has come back for a week or more — an RFQ out, a quote chased.", them, (o) => "Gradcon wrote " + fmtDay(o.lastContact) + " · " + agoLabel(daysSince(o.lastContact)) + (o.threads[0] ? ' · <span class="muted">' + esc(o.threads[0].subject) + "</span>" : ""));
}
function renderMethod(){
  const seedAt = (typeof REGISTER_SEED !== "undefined" && REGISTER_SEED.builtAt) || "";
  return '<div class="method card">' +
    "<h3>What this register is</h3><p>One shared list of every organisation Gradcon deals with — the <b>supply chain</b> (subcontractors, suppliers, consultants, services) kept apart from the <b>clients</b> (builders and head contractors who send Gradcon tenders, and private owners / developers). Every field is editable and saves to the cloud row <code>gradcon-register</code>, so Grady and projects@ see the same list on every device. Nothing here is written back to the mailbox.</p>" +
    "<h3>Where the first version came from</h3><ul><li>The <b>projects@gradcon.com.au mailbox</b> — 818 messages read on " + esc(seedAt) + ", drafts and system mail left out. For every organisation: how many emails in and out, how many threads, the date and direction of the last one, the median time they took to answer a Gradcon email, the people on the emails with the phone numbers and job titles in their own signatures, and the subjects.</li><li>The <b>contractor / supplier workbook</b> of the same day (59 organisations, 97 people, 116 project associations) — its trade descriptions, websites, project lists and evidence notes were folded in where the mailbox read did not reach (e.g. Holcim, Bomax, Danterr).</li><li>The <b>Project Management register</b> seed rows (20 contractors and suppliers with phones) — carried over so nothing is lost.</li></ul>" +
    "<h3>The evidence score (0–100) and tiers</h3><p>It measures <b>correspondence</b>, not performance: volume (6 × ln(1 + emails), max 30) + breadth (5 per thread, max 20) + two-way correspondence (15) + their reply time (≤ 24 h 15, ≤ 72 h 10, slower 5) + recency (≤ 30 days 20, ≤ 90 days 14, ≤ 180 days 8, older 2). Tier A ≥ 80, B ≥ 60, C ≥ 40, D below. A high score means Gradcon has a lot of recent, answered correspondence with them — it says nothing about their workmanship, safety or payment. <b>Grady's star rating</b> is the judgement; it is never computed.</p>" +
    "<h3>Capabilities — what they do and do not do</h3><p>Read from the contractor's <em>own</em> sentences, never from what Gradcon asked them to price (an RFQ for bored piers sent to a screw-piler proves nothing). A ✓ carries the sentence and date it came from; a ✗ is an explicit statement (\"we do not install screw piles\") or a consistent pattern (pricing screw piles as the alternative whenever bored piers are specified); a ? means they have not said. The piling matrix at the top of the Supply chain list (filter the Piling trade, or pick a capability) puts the foundation contractors side by side. Change any of them inside the row — your setting stands until you change it again.</p>" +
    "<h3>Keeping it current</h3><ul><li><b>Check mail now</b> on a row, or <b>Check mail for N shown</b>, asks the mailbox (read-only, through the portal's Google connection) for the newest email to or from that organisation's addresses and moves the last-contact date and direction. It runs only when you click it.</li><li><b>Ball with Gradcon</b> = their email is the last in the thread, 3+ days. <b>Waiting on them</b> = Gradcon wrote last, 3+ days (7+ on the Follow-ups tab). <b>Going cold</b> = nothing for 90 days.</li><li><b>Add missing from list</b> brings in any organisation from the built-in seed that is not here — it never overwrites an edit and never resurrects one you removed.</li><li>Edits from two devices merge organisation by organisation (the newer edit of each wins); removals are remembered so they do not come back.</li></ul>" +
    "<h3>What to verify before relying on an entry</h3><p>ABN and GST on the ABR, the public liability and workers compensation certificates and their expiry, the VBA registration or licence class where the trade needs one, and the latest rate. The Compliance block holds those; the Verification note on the workbook said the same of every entry.</p>" +
    '<h3>Change log</h3><ul class="log" style="padding-left:16px">' + STATE.log.slice(-40).reverse().map((l) => '<li><span class="d">' + new Date(l.at).toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) + "</span>" + (l.org ? "<b>" + esc(l.org) + "</b> — " : "") + esc(l.text) + ' <span class="muted">— ' + esc(l.by) + "</span></li>").join("") + "</ul></div>";
}

/* ============================ events ============================ */
document.getElementById("tabnav").addEventListener("click", (e) => { const b = e.target.closest(".tab-btn"); if (!b) return; UI.tab = b.dataset.tab; UI.cats.clear(); UI.trades.clear(); UI.cap = ""; UI.kpi = ""; UI.pinTop = null; render(); });
const main = document.getElementById("main");
main.addEventListener("click", (e) => {
  const t = e.target;
  const kpi = t.closest("[data-kpi]"); if (kpi) { UI.kpi = UI.kpi === kpi.dataset.kpi ? "" : kpi.dataset.kpi; render(); return; }
  // every chip row is ONE choice: click a chip to see only those, click it again to clear
  const cat = t.closest("[data-cat]"); if (cat) { const k = cat.dataset.cat; const was = UI.cats.has(k); UI.cats.clear(); if (!was) UI.cats.add(k); render(); return; }
  const tr = t.closest("[data-trade]"); if (tr) { const k = tr.dataset.trade; const was = UI.trades.has(k); UI.trades.clear(); if (!was) UI.trades.add(k); render(); return; }
  const cc = t.closest("[data-capchip]"); if (cc) { UI.cap = UI.cap === cc.dataset.capchip ? "" : cc.dataset.capchip; render(); return; }
  const co = t.closest("[data-compose-open]"); if (co) { const o = orgById(co.dataset.composeOpen); const c = o.contacts.filter((x) => x.email); const idx = Math.max(0, c.findIndex((x) => x.primary)); const tpl = emailTemplate(o, c[idx] || null); COMPOSE[o.id] = { contactIdx: idx, subject: tpl.subject, text: tpl.text, approved: false, status: "draft" }; if (!MAIL) loadMailStatus(); render(); return; }
  const cc2 = t.closest("[data-compose-close]"); if (cc2) { delete COMPOSE[cc2.dataset.composeClose]; render(); return; }
  const ca = t.closest("[data-compose-approve]"); if (ca) { const st = COMPOSE[ca.dataset.composeApprove]; if (st) { st.approved = !st.approved; render(); } return; }
  const cr = t.closest("[data-compose-redraft]"); if (cr) { const o = orgById(cr.dataset.composeRedraft); const st = COMPOSE[o.id]; const c = o.contacts.filter((x) => x.email); const tpl = emailTemplate(o, c[st.contactIdx] || null); Object.assign(st, { subject: tpl.subject, text: tpl.text, approved: false }); render(); return; }
  const cs = t.closest("[data-compose-send]"); if (cs) { sendCompose(orgById(cs.dataset.composeSend)); return; }
  const mo = t.closest("[data-more]"); if (mo) { const id = mo.dataset.more; UI.more.has(id) ? UI.more.delete(id) : UI.more.add(id); render(); return; }
  const ac2 = t.closest("[data-allcaps]"); if (ac2) { const id = ac2.dataset.allcaps; UI.allCaps.has(id) ? UI.allCaps.delete(id) : UI.allCaps.add(id); render(); return; }
  const th = t.closest("th[data-sort]"); if (th) { UI.sort = th.dataset.sort; render(); return; }
  if (t.id === "addBtn") { addOrg(UI.tab === "client" ? "builder" : UI.cats.size === 1 ? [...UI.cats][0] : "subcontractor"); return; }
  if (t.id === "csvBtn") { const list = visibleOrgs(); downloadCsv("gradcon-register-" + today() + ".csv", ["Organisation", "Category", "Trade group", "Trade / scope", "Status", "Rating", "Evidence score", "Tier", "Last contact", "Last direction", "Median reply (h)", "Emails in", "Emails out", "Primary contact", "Role", "Mobile", "Phone", "Email", "All phones", "All emails", "Website", "ABN", "Projects", ...PILING_KEYS.map((k) => CAP[k] ? CAP[k].label : k), "Follow-up", "Follow-up note", "Notes", "Risks"], list.map((o) => { const pc = o.contacts.find((c) => c.primary) || o.contacts[0] || {}; return [o.name, (CAT[o.category] || CAT.other).label, TG[o.tradeGroup] || "", o.trade, o.status, o.rating, o.score, o.tier, o.lastContact, o.lastContactDir, o.medianReplyHrs ?? "", o.inbound, o.outbound, pc.name || "", pc.role || "", pc.mobile || "", pc.phone || "", pc.email || "", o.phones.join("; "), o.emails.join("; "), o.website, o.abn, o.projects.join("; "), ...PILING_KEYS.map((k) => (o.capabilities[k] || {}).status || ""), (o.followUp || {}).date || "", (o.followUp || {}).note || "", o.notes, o.risks]; })); return; }
  if (t.id === "peopleCsv") { const rows = []; for (const o of STATE.orgs) for (const c of o.contacts) rows.push([c.name, c.role, o.name, (CAT[o.category] || CAT.other).label, c.email, c.phone, c.mobile, c.primary ? "yes" : "", c.lastContact]); downloadCsv("gradcon-register-people-" + today() + ".csv", ["Name", "Role", "Organisation", "Category", "Email", "Phone", "Mobile", "Primary", "Last contact"], rows); return; }
  if (t.id === "seedBtn") { addMissingFromSeed(); return; }
  if (t.id === "checkAllBtn") { checkAll(visibleOrgs()); return; }
  const rate = t.closest("[data-rate]"); if (rate) { const o = orgById(rate.dataset.org); const v = Number(rate.dataset.rate); o.rating = o.rating === v ? 0 : v; touch(o); log(o, "Rating set to " + o.rating + " star" + (o.rating === 1 ? "" : "s")); save(); render(); return; }
  const cm = t.closest("[data-checkmail]"); if (cm) { cm.disabled = true; cm.textContent = "Checking…"; checkMail(orgById(cm.dataset.checkmail)).then((r) => { render(); if (r.error) alert("Could not read the mailbox: " + r.error); else if (r.none) alert("No email found to or from those addresses."); }); return; }
  const rm = t.closest("[data-remove]"); if (rm) { if (rm.dataset.armed) { removeOrg(rm.dataset.remove); } else { rm.dataset.armed = "1"; rm.textContent = "Click again to remove"; setTimeout(() => { if (rm.isConnected) { delete rm.dataset.armed; rm.textContent = "Remove from register"; } }, 3000); } return; }
  const dc = t.closest("[data-delcontact]"); if (dc) { const o = orgById(dc.dataset.org); const c = o.contacts.splice(Number(dc.dataset.delcontact), 1)[0]; if (c && c.primary && o.contacts[0]) o.contacts[0].primary = true; touch(o); log(o, "Removed " + (c ? c.name || c.email : "a person")); save(); render(); return; }
  const ac = t.closest("[data-addcontact]"); if (ac) { const o = orgById(ac.dataset.addcontact); o.contacts.push({ id: "c-" + uid(), name: "", role: "", email: "", phone: "", mobile: "", primary: !o.contacts.length, lastContact: "", inbound: 0, outbound: 0, source: "added by " + userKey() }); touch(o); save(); render(); return; }
  const jump = t.closest("[data-jump]"); if (jump) { UI.tab = "all"; UI.q = ""; UI.kpi = ""; UI.status = ""; UI.cats.clear(); UI.trades.clear(); UI.open.add(jump.dataset.jump); render(); const row = document.querySelector('[data-open="' + jump.dataset.jump + '"]'); if (row) { row.scrollIntoView({ block: "start", behavior: "smooth" }); row.classList.add("flash"); } return; }
  if (t.closest("input,select,textarea,button,a,label")) return;
  const row = t.closest("tr.org[data-open]"); if (row) { const id = row.dataset.open; UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id); render(); }
});
main.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.composeSubject) { const st = COMPOSE[t.dataset.composeSubject]; if (st) { st.subject = t.value; if (st.approved) { st.approved = false; const b = document.querySelector('[data-compose-approve="' + t.dataset.composeSubject + '"]'); if (b) { b.textContent = "Approve this draft"; b.classList.remove("primary"); } const sb = document.querySelector('[data-compose-send="' + t.dataset.composeSubject + '"]'); if (sb) sb.disabled = true; } } return; }
  if (t.dataset.composeText) { const st = COMPOSE[t.dataset.composeText]; if (st) { st.text = t.value; if (st.approved) { st.approved = false; const b = document.querySelector('[data-compose-approve="' + t.dataset.composeText + '"]'); if (b) { b.textContent = "Approve this draft"; b.classList.remove("primary"); } const sb = document.querySelector('[data-compose-send="' + t.dataset.composeText + '"]'); if (sb) sb.disabled = true; } } return; }
  if (t.id === "q") { UI.q = t.value; clearTimeout(main._qt); main._qt = setTimeout(() => { const el = $("#q"); const pos = el ? el.selectionStart : 0; render(); const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220); return; }
  const o = t.dataset.org && orgById(t.dataset.org); if (!o) return;
  if (t.dataset.path) { setPath(o, t.dataset.path, t.type === "number" ? Number(t.value) : t.value); touch(o); save(); }
  else if (t.dataset.list) { o[t.dataset.list] = t.value.split(/;\s*|,\s*(?=[^,]*@)|\n/).map((s) => s.trim()).filter(Boolean); touch(o); save(); }
  else if (t.dataset.contact != null && t.dataset.field) { const c = o.contacts[Number(t.dataset.contact)]; if (c) { c[t.dataset.field] = t.value; touch(o); save(); } }
});
main.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.composeTo) { const st = COMPOSE[t.dataset.composeTo]; if (st) { st.contactIdx = Number(t.value); st.approved = false; render(); } return; }
  if (t.id === "tierSel") { UI.tier = t.value; render(); return; }
  if (t.id === "statusSel") { UI.status = t.value; render(); return; }
  if (t.id === "sortSel") { UI.sort = t.value; render(); return; }
  const o = t.dataset.org && orgById(t.dataset.org); if (!o) return;
  if (t.dataset.cap) { const key = t.dataset.cap; const prev = o.capabilities[key] || {}; o.capabilities[key] = { status: t.value, evidence: (prev.by === "mail" && prev.evidence ? prev.evidence + " · " : "") + "set by " + userKey() + " on " + fmtDay(today()), by: userKey() }; if (t.value === "unknown" && prev.by !== "mail") delete o.capabilities[key]; touch(o); log(o, (CAP[key] ? CAP[key].label : key) + ": " + (t.value === "yes" ? "does" : t.value === "no" ? "does NOT" : "not stated")); save(); render(); return; }
  if (t.dataset.primary != null) { o.contacts.forEach((c, i) => { c.primary = i === Number(t.dataset.primary); }); touch(o); save(); render(); return; }
  if (t.dataset.path) { if (t.dataset.path === "category") { o.side = (CAT[o.category] || CAT.other).side; o.confidence = ""; } if (t.dataset.path in LOGGED_FIELDS) log(o, LOGGED_FIELDS[t.dataset.path] + " → " + (t.value || "—")); if (t.tagName === "SELECT" || t.type === "date") { save(); render(); } else render(); return; }
  if (t.dataset.list || t.dataset.contact != null) { render(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollCloud(); });
load();
</script>
