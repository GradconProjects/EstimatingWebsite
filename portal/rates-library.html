<!doctype html>
<meta charset="UTF-8">
<title>GRADCON Rates Library</title>
<style>

:root{
  --navy:#0f2e4c; --navy2:#1F4E78; --navy-light:#D9EAF7; --input-bg:#DDEBF7;
  --border:#c9d6e0; --bg:#eef2f6; --linked:#1a7a3c; --accent:#2f7fd6;
  --flag-bg:#FFF3CD; --flag-border:#e0b93d; --total-bg:#eef4f9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Calibri,Arial,sans-serif;background:var(--bg);color:#1c2b36;font-size:13px;}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.header-brand{display:flex;align-items:center;gap:14px;}
.logo-badge{background:#fff;border-radius:8px;padding:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.25);display:flex;align-items:center;}
.logo-badge img{height:48px;display:block;}
header h1{margin:0;font-size:17px;letter-spacing:.02em;font-weight:600;color:#dcebf6;}
header .subtitle{font-size:11.5px;opacity:.85;max-width:540px;text-align:right;}
#tabnav{display:flex;gap:2px;background:#0c2438;padding:0 18px;overflow-x:auto;}
.tab-btn{background:transparent;border:none;color:#a9c6de;padding:11px 15px;cursor:pointer;font-size:12.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn:hover{color:#fff;}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent);background:var(--navy2);}
#main{padding:18px;max-width:1900px;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
h2{color:var(--navy2);margin:0 0 6px 0;}
.hint{color:#5a7186;font-style:italic;margin:0 0 14px 0;font-size:12px;max-width:1100px;}

/* Home dashboard */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:22px 26px;border-radius:10px;margin-bottom:18px;}
.hero h1{margin:0 0 8px 0;font-size:22px;}
.hero .hint{color:#cfe0ee;margin:0;max-width:900px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,46,76,.06);}
.kpi-label{font-size:11px;color:#5a7186;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.kpi-value{font-size:20px;font-weight:700;color:var(--navy);}
.kpi-value.small{font-size:12.5px;font-weight:600;line-height:1.3;}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
.nav-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:transform .12s, box-shadow .12s;box-shadow:0 1px 3px rgba(15,46,76,.06);}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(15,46,76,.15);border-color:var(--accent);}
.nav-card.wide{grid-column:span 2;}
.nav-icon{font-size:26px;margin-bottom:8px;}
.nav-card h3{margin:0 0 6px 0;color:var(--navy2);font-size:14.5px;}
.nav-card p{margin:0;font-size:12px;color:#5a7186;line-height:1.4;}

/* Home portfolio */
.portfolio-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.portfolio-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.portfolio-card h3{margin:0 0 8px 0;color:var(--navy2);font-size:13px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--navy-light);padding-bottom:6px;}
.portfolio-card td{cursor:pointer;}
.portfolio-card tr:hover td{background:#f4f9fc;}
.row-active td{background:#f4fbf6 !important;font-weight:700;}

/* Projects tab */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;color:#3a4a58;cursor:pointer;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--navy2);border-color:var(--navy2);color:#fff;}
.filter-btn.add-btn{margin-left:auto;background:var(--linked);border-color:var(--linked);color:#fff;}
.filter-btn.add-btn:hover{opacity:.9;color:#fff;}
.new-project-form{border:2px dashed var(--accent);}
.save-btn{background:var(--linked);color:#fff;border:none;border-radius:5px;padding:8px 20px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:8px;}
.save-btn:hover{opacity:.9;}

.project-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px;}
.project-card{background:#fff;border:2px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;position:relative;}
.project-card:hover{border-color:var(--accent);}
.project-card.active{border-color:var(--linked);background:#f4fbf6;}
.proj-title{font-weight:700;color:var(--navy2);font-size:13px;margin-bottom:6px;padding-right:60px;}
.proj-meta{font-size:11.5px;color:#5a7186;margin-bottom:2px;}
.proj-badge{position:absolute;bottom:10px;right:10px;background:var(--linked);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.project-card{position:relative;}
.project-card.cat-tender{border-left:4px solid #b5842a;}
.project-card.cat-project{border-left:4px solid var(--accent);}
.proj-cat-tag{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:9px;background:var(--navy-light);color:var(--navy2);}
.project-card.cat-tender .proj-cat-tag{background:#fbeecb;color:#8a6414;}
.proj-delete-btn{position:absolute;top:8px;left:8px;width:20px;height:20px;line-height:18px;text-align:center;padding:0;border:1px solid var(--border);border-radius:50%;background:#fff;color:#a33;font-size:12px;font-weight:700;cursor:pointer;}
.proj-delete-btn:hover{background:#a33;color:#fff;border-color:#a33;}

table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;}
th,td{padding:5px 7px;border:1px solid var(--border);text-align:left;white-space:nowrap;}
thead th{background:var(--navy2);color:#fff;position:sticky;top:0;}
.sec-row td{background:var(--navy-light);color:var(--navy2);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.subtotal-row td{background:var(--total-bg);font-weight:700;}
.total-row td, .total-cell{background:var(--total-bg);font-weight:700;color:var(--navy2);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.note{white-space:normal;color:#5a7186;font-style:italic;max-width:220px;}
.calc, .calc-label{color:#3a4a58;background:#f7f9fb;}
.linked{color:var(--linked);font-weight:600;}
.tag{font-size:10.5px;background:var(--navy-light);color:var(--navy2);padding:2px 6px;border-radius:3px;text-transform:none;letter-spacing:0;font-weight:600;margin-left:6px;}

input[type=number], input[type=text]{
  width:100%;min-width:64px;background:var(--input-bg);border:1px solid #a9c6de;border-radius:3px;
  padding:3px 5px;font-size:12.5px;color:#1c2b36;text-align:right;
}
input[type=text]{text-align:left;}
input:focus{outline:2px solid var(--navy2);outline-offset:0;}
input:disabled{background:#f0f4f7;color:#7c8a96;}

.panel-block{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;}
.panel-block h3{margin:0 0 8px 0;color:var(--navy2);font-size:13px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--navy-light);padding-bottom:6px;}
.kv-table td:first-child{color:#3a4a58;}
.buildup-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px;}
.buildup-table td:first-child{color:#3a4a58;width:60%;}

@media (max-width:900px){
  .buildup-cards{grid-template-columns:1fr;}
  .nav-card.wide{grid-column:span 1;}
}

/* BOQ tabs */
.row-selected{background:#f4fbf6;}
.filter-count{margin-left:auto;font-size:12px;color:#5a7186;align-self:center;}
.boq-toolbar{margin-bottom:14px;}
.boq-report{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px 24px;max-width:1000px;}
.boq-header h2{margin:0 0 12px 0;}
.boq-logo{height:72px;display:block;margin-bottom:14px;}
.boq-meta{margin-bottom:18px;}
.boq-meta td:first-child{color:#5a7186;width:110px;}
.boq-meta td{border:none;padding:2px 6px;}
.boq-table td, .boq-table th{white-space:normal;}

/* Print / PDF export */
@media print{
  header, #tabnav, .no-print{ display:none !important; }
  body{ background:#fff; font-size:11px; }
  #main{ padding:0; max-width:none; }
  .tab-panel{ display:none !important; }
  .tab-panel.active{ display:block !important; }
  .boq-report{ border:none; padding:0; box-shadow:none; max-width:none; }
  table{ box-shadow:none; }
  thead th{ background:#1F4E78 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sec-row td{ background:#D9EAF7 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

/* Cost control */
.kpi-value.neg{color:#c0392b;}
.kpi-value.pos{color:#1e7e34;}
.mini-add{background:var(--linked);color:#fff;border:none;border-radius:12px;padding:3px 10px;font-size:10.5px;font-weight:700;cursor:pointer;margin-left:8px;text-transform:none;letter-spacing:0;}
.mini-add:hover{opacity:.9;}
.mini-del{background:#f4d6d2;color:#a02c1f;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;font-weight:700;}
.mini-del:hover{background:#e8b3ac;}

/* Standard BOQ member grouping */
.member-row td{background:var(--navy2);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:7px;}

/* Schedule / Gantt */
.sched-table td{vertical-align:middle;}
.gantt-cell{min-width:180px;}
.gantt-track{position:relative;height:22px;background:#eef2f6;border-radius:4px;overflow:hidden;min-width:160px;}
.gantt-bar{position:absolute;top:2px;height:8px;border-radius:3px;}
.gantt-bar.planned{background:var(--accent);top:3px;}
.gantt-bar.actual{background:var(--linked);top:12px;}

/* Flagged / quote-based inputs */
input.flag-input{background:var(--flag-bg);border-color:var(--flag-border);}

/* Summary & Charts */
.summary-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
.chart-row{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-bottom:14px;}
.chart-wrap{overflow-x:auto;padding:6px 0;}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:11.5px;color:#3a4a58;}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{display:inline-block;width:11px;height:11px;border-radius:2px;}

/* Resource schedule grid */
.rs-table-wrap{overflow-x:auto;}
.rs-table th, .rs-table td{white-space:nowrap;}
.rs-table input{min-width:56px;}

@media (max-width:1000px){
  .summary-grid, .chart-row{grid-template-columns:1fr;}
}

/* Project Scope */
.scope-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px;}
.scope-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:#fff;}
.scope-toggle.on{border-color:var(--linked);background:#f4fbf6;color:#1c2b36;}
.scope-toggle.off{border-color:var(--border);background:#f7f9fb;color:#8a97a3;text-decoration:line-through;}
.scope-toggle.locked{cursor:default;border-color:var(--linked);background:#f4fbf6;text-decoration:none;font-weight:600;}
.scope-toggle input{cursor:pointer;}

/* Out-of-scope BOQ rows */
.member-row-outofscope td{background:#8a97a3 !important;color:#fff;}
tr.row-outofscope{opacity:.5;}
tr.row-outofscope input, tr.row-outofscope select{background:#eef0f2;color:#9aa5ad;}

/* Import */
#import_file{margin-top:6px;}
.scope-grid-compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
.scope-grid-compact .scope-toggle{padding:6px 8px;font-size:11.5px;}


.accordion{margin-bottom:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;align-self:start;}
.accordion summary{cursor:pointer;padding:12px 16px;background:var(--navy-light);color:var(--navy2);font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.accordion summary::-webkit-details-marker{display:none;}
.accordion summary::after{content:"\25BE";font-size:12px;transition:transform .15s;flex-shrink:0;}
.accordion[open] summary::after{transform:rotate(180deg);}
.accordion .acc-body{padding:14px 16px;overflow-x:auto;}
.acc-count{font-weight:400;font-size:11.5px;color:#5a7186;margin-left:8px;white-space:nowrap;}
.lib-header{display:flex;align-items:center;gap:16px;padding:16px 22px;background:#fff;border-bottom:2px solid var(--border);}
.lib-header img{height:44px;}
.lib-header h1{font-size:19px;margin:0;color:var(--navy2);}
.lib-header .sub{font-size:12px;color:#5a7186;margin-top:2px;}
.save-zone{display:flex;align-items:center;gap:9px;margin-left:auto;flex-shrink:0;}
.save-status{font-size:11px;color:#5a7186;white-space:nowrap;min-width:110px;text-align:right;}
.save-status.ok{color:var(--linked);}
.save-status.err{color:#a33;}
#saveBtn{background:var(--linked);color:#fff;border:none;border-radius:5px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
#saveBtn:hover{opacity:.9;}
.lib-wrap{max-width:1500px;margin:0 auto;padding:20px;}

.lib-nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:18px;position:sticky;top:10px;z-index:5;box-shadow:0 2px 8px rgba(15,46,76,.06);}
.lib-nav button{background:var(--navy-light);border:1px solid var(--border);color:var(--navy2);font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.lib-nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media (max-width:920px){ .acc-grid{grid-template-columns:1fr;} .lib-nav{position:static;} }
</style>

// Backfill any category/product this file's defaults know about that the saved
// state doesn't yet have (e.g. after adding a new product), WITHOUT ever
// overwriting a value Grady already edited. Unlike Cost Planner's own rates
// migration, this app never wholesale-reseeds on a version bump — this app IS
// the rates, so a bump here only ever adds, never overwrites.
function backfill(saved, fresh){
  Object.keys(fresh).forEach(cat=>{
    if(saved[cat]===undefined){ saved[cat]=fresh[cat]; return; }
    if(typeof fresh[cat]!=="object" || fresh[cat]===null || Array.isArray(fresh[cat])) return;
    Object.keys(fresh[cat]).forEach(key=>{
      if(saved[cat][key]===undefined) saved[cat][key]=fresh[cat][key];
    });
  });
  return saved;
}

/* ============================= CROSS-DEVICE SYNC (Supabase) =============================
 * Every browser/device reads and writes the same row in Supabase's estimator_kv table
 * (see supabase/migrations/0001_estimator_kv.sql) — the same table the Quotes app
 * (src/lib/storage.js) uses, so this file and Quotes share one sync fabric. The
 * anon/publishable key below is meant to be public — gated by row-level security, not
 * secrecy (see CLAUDE.md "Known limitations") — and already ships inside the Quotes
 * bundle the same way. localStorage stays the instant local cache/fallback; Supabase
 * sync layers on top and never replaces it, so this still works fully offline or if
 * Supabase is ever unreachable — the "Save failed" path is unaffected either way. */
const SUPABASE_URL = "https://xbmyhvrcuyapoarmchpv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Kr4dTFXhZsifAA28HmMAVQ_EDSR2DL0";
async function kvFetch(key){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/estimator_kv?key=eq.${encodeURIComponent(key)}&select=value,updated_at`, {
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      signal: AbortSignal.timeout(8000), // fail fast on a dead/slow connection rather than hang
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return rows[0] || null;
  }catch(e){ return null; }
}
async function kvPush(key, value){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/estimator_kv`, {
      method:"POST",
      headers:{
        apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=representation"
      },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
      signal: AbortSignal.timeout(8000),
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return rows[0] || null;
  }catch(e){ return null; }
}

function loadRates(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
let state = backfill(loadRates() || {}, freshRates());
if(!state.ratesVersion) state.ratesVersion = RATES_VERSION;
// Reinforcement wastage is standardised at 5% — coerce any stored steel
// entry still carrying an old default (8% bar / 3% processed) once on load,
// so saved rate blobs can't keep the retired figures alive. Runs on every
// load but only rewrites entries that differ.
(function(){
  try{
    Object.keys(state.steel||{}).forEach(function(k){
      if(state.steel[k] && typeof state.steel[k].waste==="number" && (state.steel[k].waste===0.08 || state.steel[k].waste===0.03)) state.steel[k].waste=0.05;
    });
    // Holcim production & transport surcharge is now $9.17/m³ — lift any
    // stored blob still on the retired $2.59 seed (a deliberately edited
    // figure other than 2.59 is left alone).
    if(state.global && state.global.concreteSurchargePerM3===2.59) state.global.concreteSurchargePerM3=9.17;
  }catch(e){}
})();

// Pulls whatever another device last saved, if it's newer than what this browser has —
// on load, when the tab regains focus, and on a slow poll as a background safety net.
// Never overwrites a local edit that's newer than the cloud copy. If the cloud has no
// row at all yet (genuinely first save anywhere), seeds it from this browser's current
// state instead of pulling — the one case a push-on-load is safe, since there's nothing
// real to clobber.
let syncingFromCloud = false;
async function syncFromCloud(){
  if(syncingFromCloud) return;
  syncingFromCloud = true;
  try{
    const row = await kvFetch(STORAGE_KEY);
    if(!row){
      // Nothing in the cloud yet — seed it from this browser's state, and also make sure
      // a same-browser read of localStorage (Cost Planner's applySharedRatesLibrary(), etc.)
      // has something to find, matching this file's pre-sync behaviour of always writing
      // gradcon-rates-library on load.
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      const pushed = await kvPush(STORAGE_KEY, state);
      if(pushed) try{ localStorage.setItem(STORAGE_KEY+"__syncedAt", pushed.updated_at); }catch(e){}
      return;
    }
    const localSyncedAt = localStorage.getItem(STORAGE_KEY+"__syncedAt");
    if(localSyncedAt && row.updated_at <= localSyncedAt) return;
    state = backfill(row.value || {}, freshRates());
    if(!state.ratesVersion) state.ratesVersion = RATES_VERSION;
    try{ if(state.global && state.global.concreteSurchargePerM3===2.59) state.global.concreteSurchargePerM3=9.17; }catch(e){}
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.setItem(STORAGE_KEY+"__syncedAt", row.updated_at);
    }catch(e){}
    renderApp();
  } finally {
    syncingFromCloud = false;
  }
}

let saveStatusTimer = null;
function showSaveStatus(kind){
  const el = document.getElementById("saveStatus");
  if(!el) return;
  el.classList.remove("ok","err");
  if(kind==="ok"){
    el.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    el.classList.add("ok");
  } else if(kind==="err"){
    el.textContent = "Save failed — storage may be full/disabled";
    el.classList.add("err");
  }
  clearTimeout(saveStatusTimer);
  if(kind==="ok"){
    saveStatusTimer = setTimeout(()=>{ el.textContent = "All changes saved automatically"; el.classList.remove("ok"); }, 4000);
  }
}
function saveRates(){
  try{
    state.ratesVersion = RATES_VERSION;
    state.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    showSaveStatus("ok");
  }catch(e){ showSaveStatus("err"); }
  kvPush(STORAGE_KEY, state).then(row=>{
    if(!row) return;
    try{ localStorage.setItem(STORAGE_KEY+"__syncedAt", row.updated_at); }catch(e){}
  });
}

// ---- Generic editable table builder: one row per {p, u, ...} item, one
// editable numeric input per field in `fields`. Every category in this app is
// rendered through this one function so the markup/wiring never drifts between
// sections. ----
function editableTable(items, stateMap, keyOf, fields, opts){
  opts = opts||{};
  let h = `<table class="item-table"><thead><tr><th>${opts.itemLabel||"Item"}</th>${opts.showUnit!==false?"<th>Unit</th>":""}${fields.map(f=>`<th>${f.label}</th>`).join("")}</tr></thead><tbody>`;
  items.forEach((it,idx)=>{
    const key = keyOf(it, idx);
    const row = stateMap[key];
    h += `<tr><td>${it.p}</td>${opts.showUnit!==false?`<td>${it.u||""}</td>`:""}`;
    fields.forEach(f=>{
      h += `<td><input type="number" step="any" class="lib-input" data-map="${opts.mapName}" data-key="${key}" data-field="${f.field}" value="${row[f.field]}"></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table>`;
  return h;
}

function section(id, navLabel, title, count, bodyHtml, openByDefault){
  navMeta.push({id, navLabel});
  return `<details class="accordion" id="${id}" ${openByDefault?"open":""}><summary>${title} <span class="acc-count">${count} item${count===1?"":"s"}</span></summary><div class="acc-body">${bodyHtml}</div></details>`;
}

let navMeta = [];
function renderApp(){
  let h = "";
  navMeta = [];

  // Concrete
  h += section("sec-concrete", "Concrete", "Concrete — established grade rates (Holcim, real current quote)",
    CONCRETE_GRADE_ITEMS.length,
    `<p class="hint">$/m³, ex GST. Sourced from Holcim's actual Gradcon supply quote — no escalation baked in.</p>` +
    editableTable(CONCRETE_GRADE_ITEMS, state.concreteGrade, it=>it.p, [{field:"cost",label:"Rate ($/m3)"}], {mapName:"concreteGrade", showUnit:false}) +
    `<div class="panel-block" style="margin-top:10px;"><h3>Production &amp; Transport Surcharge</h3>
     <p class="hint">Holcim reviews this FORTNIGHTLY. Check their notice and update this number here — it applies on top of every concrete rate above.</p>
     <table class="kv-table"><tbody><tr><td>Surcharge ($/m3)</td><td><input type="number" step="any" id="surcharge" value="${state.global.concreteSurchargePerM3}"></td></tr></tbody></table></div>
     <div class="panel-block" style="margin-top:10px;"><h3>Concrete pour-type reference (used by Cost Planner's blended Substructure rate)</h3>` +
    editableTable(CONCRETE_ITEMS, state.concrete, it=>it.p, [{field:"supply",label:"Supply ($/m3)"}], {mapName:"concrete", showUnit:false}) +
    `</div>
     <div class="panel-block" style="margin-top:10px;"><h3>Shared concrete labour/plant assumptions</h3>
     <table class="kv-table"><tbody>
       <tr><td>Placing labour (hrs/m3)</td><td><input type="number" step="any" id="cl_placing" value="${state.concreteLabour.placingHrsPerM3}"></td></tr>
       <tr><td>Finishing labour (hrs/m3)</td><td><input type="number" step="any" id="cl_finishing" value="${state.concreteLabour.finishingHrsPerM3}"></td></tr>
       <tr><td>Curing compound ($/m3)</td><td><input type="number" step="any" id="cl_curing" value="${state.concreteLabour.curingRate}"></td></tr>
       <tr><td>Testing allowance ($/m3)</td><td><input type="number" step="any" id="cl_testing" value="${state.concreteLabour.testingRate}"></td></tr>
     </tbody></table></div>`,
    false);

  // Reinforcement
  let reoBody = `<p class="hint">$/unit established rate per product — Trench Mesh, Square Mesh and Stock Bar from AKZ Reinforcing's current Gradcon quote; Processed Bar uniform $1925/t converted to $/m by weight. Every diameter is independently editable.</p>` +
    `<div class="panel-block"><h3>Reinforcing steel delivery fee</h3>
     <p class="hint">AKZ Reinforcing's delivered-to-site fee, applied on top of every established rate to the left, proportional to each product's own weight.</p>
     <table class="kv-table"><tbody><tr><td>Delivery ($/tonne)</td><td><input type="number" step="any" id="g_reodelivery" value="${state.global.reinforcementDeliveryPerTonne}"></td></tr></tbody></table></div>
     <div class="panel-block" style="margin-top:10px;"><h3>Reinforcement &amp; formwork takeoff allowances</h3>
     <p class="hint">Read LIVE by the Estimates takeoff on every recompute — change them here anytime and every element re-prices. Wastage applies to all reinforcement; the bar lap applies to bar laps, the sheet/trench lap to mesh sheets and trench mesh.</p>
     <table class="kv-table"><tbody>
      <tr><td>Reinforcement wastage (%)</td><td><input type="number" step="any" id="g_reowaste" value="${state.global.reoWastePct??5}"></td></tr>
      <tr><td>Lap allowance — bars (%)</td><td><input type="number" step="any" id="g_barlap" value="${state.global.barLapPct??8}"></td></tr>
      <tr><td>Lap allowance — mesh sheets &amp; trench (%)</td><td><input type="number" step="any" id="g_meshlap" value="${state.global.meshLapPct??5}"></td></tr>
      <tr><td>Formwork wastage (%)</td><td><input type="number" step="any" id="g_formwaste" value="${state.global.formworkWastePct??5}"></td></tr>
     </tbody></table></div>`;
  const reoMapFor = {"Trench mesh":"trenchMesh","Square Mesh":"squareMesh","Stock Bar":"stockBar","Processed Bar":"processedBar"};
  Object.keys(REINFORCEMENT_ITEMS).forEach(group=>{
    const g = REINFORCEMENT_ITEMS[group];
    const mapKey = reoMapFor[group];
    const map = state.reinforcementEstablished[mapKey];
    const uinfo = UNIT_RATE_INFO[group];
    const showsTonne = group === "Stock Bar"; // see STOCK_BAR_TONNE_INFO above
    reoBody += `<div class="panel-block"><h3>${group}</h3><table class="item-table"><thead><tr><th>Product</th><th>Unit</th><th>Weight (kg)</th><th>Base Rate ($/unit)</th>${uinfo?`<th>Unit rate (${uinfo.label})</th>`:''}${showsTonne?`<th>Steel rate (${STOCK_BAR_TONNE_INFO.label})</th>`:''}</tr></thead><tbody>`;
    g.items.forEach(it=>{
      const has = Object.prototype.hasOwnProperty.call(map, it.p);
      const baseCell = has?`<input type="number" step="any" class="lib-input" data-map="reinforcementEstablished.${mapKey}" data-key="${it.p}" data-field="_" value="${map[it.p]}">`:'<span class="note">— (BCI fallback below)</span>';
      let unitCell = '';
      if(uinfo){
        const unitVal = has ? uinfo.toUnit(map[it.p], it.w) : null;
        unitCell = `<td>${has?`<input type="number" step="any" class="lib-unit-rate-input" data-map="reinforcementEstablished.${mapKey}" data-key="${it.p}" data-w="${it.w}" data-group="${group}" value="${unitVal!=null?(+unitVal.toFixed(4)):''}">`:''}</td>`;
      }
      let tonneCell = '';
      if(showsTonne){
        const tonneVal = has ? STOCK_BAR_TONNE_INFO.toUnit(map[it.p], it.w) : null;
        tonneCell = `<td>${has?`<input type="number" step="any" class="lib-tonne-rate-input" data-map="reinforcementEstablished.${mapKey}" data-key="${it.p}" data-w="${it.w}" value="${tonneVal!=null?(+tonneVal.toFixed(2)):''}">`:''}</td>`;
      }
      reoBody += `<tr><td>${it.p}</td><td>${it.u}</td><td class="num">${it.w}</td><td>${baseCell}</td>${unitCell}${tonneCell}</tr>`;
    });
    reoBody += `</tbody></table></div>`;
  });
  reoBody += `<div class="panel-block"><h3>BCI fallback build-ups (only used for products with no established rate above)</h3>
    <p class="hint">The delivery fee above applies here too — not repeated per build-up.</p>`;
  ["Mesh","Bar","Processed"].forEach(key=>{
    const b = state.steel[key];
    reoBody += `<table class="kv-table" style="margin-bottom:10px;"><tbody>
      <tr><td colspan="2"><b>${STEEL_BUILDUPS[key].label}</b></td></tr>
      <tr><td>Base rate ($/t)</td><td><input type="number" step="any" class="lib-input" data-map="steel" data-key="${key}" data-field="baseRateBCI" value="${b.baseRateBCI}"></td></tr>
      <tr><td>Wastage %</td><td><input type="number" step="any" class="lib-input" data-map="steel" data-key="${key}" data-field="waste" value="${(b.waste*100).toFixed(1)}" data-pct="1"></td></tr>
      <tr><td>Consumables ($/t)</td><td><input type="number" step="any" class="lib-input" data-map="steel" data-key="${key}" data-field="consumables" value="${b.consumables}"></td></tr>
    </tbody></table>`;
  });
  reoBody += `</div>`;
    // Specialist finishing concrete (VicMix)
  h += section("sec-specialist", "Specialist concrete", "Specialist finishing concrete — VicMix exposed / decorative mixes (published $/m³) and other finishes",
    SPECIALIST_CONCRETE_ITEMS.length,
    `<p class="hint">VicMix published prices, $/m³ ex GST. VicMix says its displayed pricing applies to <b>minimum 4 m³ deliveries in a Maxi truck within 25 km of the plant</b>, <b>prices can change</b>, and <b>pigment mixes attract a $40 per truck + GST washout charge</b>. Quotes applies the washout automatically per truck of pigmented mix (truck size and the 4 m³ minimum are production rates in the Quotes Rates modal) and flags a short-load charge under 4 m³ — VicMix does not publish that amount, so enter it on the "short-load charge" row when known. Every price here flows to the Quotes catalog by name.</p>` +
    editableTable(SPECIALIST_CONCRETE_ITEMS, state.specialistConcrete, it=>it.p, [{field:"cost",label:"Rate ($)"}], {mapName:"specialistConcrete"}));

h += section("sec-reinforcement", "Reinforcement", "Reinforcement", REINFORCEMENT_ITEMS["Trench mesh"].items.length+REINFORCEMENT_ITEMS["Square Mesh"].items.length+REINFORCEMENT_ITEMS["Stock Bar"].items.length+REINFORCEMENT_ITEMS["Processed Bar"].items.length, reoBody, false);

  h += section("sec-reinf-acc", "Reo Accessories", "Reinforcing Accessories (AKZ Reinforcing, real current rates)", REINFORCING_ACCESSORIES.length,
    `<p class="hint">$/unit — bar chairs, tie wire, poly, tape.</p>` +
    editableTable(REINFORCING_ACCESSORIES, state.reinfAcc, it=>it.p, [{field:"cost",label:"Cost ($)"},{field:"waste",label:"Wastage %"}], {mapName:"reinfAcc"}));

  h += section("sec-formwork", "Formwork", "Formwork", FORMWORK_LEGACY_ITEMS.length+FORMWORK_ITEMS.length,
    `<div class="panel-block"><h3>General</h3>` +
    editableTable(FORMWORK_LEGACY_ITEMS, state.formworkLegacy, it=>it.p, [{field:"cost",label:"Rate ($)"}], {mapName:"formworkLegacy"}) +
    `</div><div class="panel-block" style="margin-top:10px;"><h3>By position (fix/strip labour)</h3>` +
    editableTable(FORMWORK_ITEMS, state.formwork, it=>it.p, [{field:"material",label:"Material ($)"},{field:"fixHrs",label:"Fix (hrs)"},{field:"stripHrs",label:"Strip (hrs)"}], {mapName:"formwork"}) +
    `</div>`);

  h += section("sec-labour", "Labour & Plant", "Labour &amp; Plant day/hour rates", LABOUR_PLANT_ITEMS.length+4,
    `<div class="panel-block"><h3>Trade day rates</h3><table class="kv-table"><tbody>
      <tr><td>Steel fixer ($/day)</td><td><input type="number" step="any" id="g_steelfixer" value="${state.global.labourSteelFixer}"></td></tr>
      <tr><td>Concreter ($/day)</td><td><input type="number" step="any" id="g_concreter" value="${state.global.labourConcreter}"></td></tr>
      <tr><td>Formworker ($/day)</td><td><input type="number" step="any" id="g_formworker" value="${state.global.labourFormworker}"></td></tr>
      <tr><td>General labour ($/day)</td><td><input type="number" step="any" id="g_general" value="${state.global.labourGeneral}"></td></tr>
    </tbody></table></div>
    <div class="panel-block" style="margin-top:10px;"><h3>Plant &amp; equipment</h3>` +
    editableTable(LABOUR_PLANT_ITEMS, state.labourPlant, (it,idx)=>idx, [{field:"cost",label:"Rate ($)"}], {mapName:"labourPlant"}) +
    `</div>`);

  h += section("sec-other-acc", "Other Accessories", "Other Accessories", OTHER_ACCESSORIES.length,
    editableTable(OTHER_ACCESSORIES, state.otherAcc, it=>it.p, [{field:"cost",label:"Cost ($)"}], {mapName:"otherAcc"}));

  h += section("sec-other-allow", "Other Allowances", "Other Allowances", OTHER_ALLOWANCES.length,
    editableTable(OTHER_ALLOWANCES, state.otherAllow, it=>it.p, [{field:"cost",label:"Cost ($)"}], {mapName:"otherAllow"}));

  h += section("sec-prelim", "Preliminaries", "Preliminaries", PRELIMINARIES_ITEMS.length,
    editableTable(PRELIMINARIES_ITEMS, state.prelim, it=>it.p, [{field:"cost",label:"Cost ($)"}], {mapName:"prelim"}));

  h += section("sec-subbies", "Subcontractors", "Subcontractor Quotes (reference — quote-based, no established rate)", SUBCONTRACTOR_ITEMS.length,
    `<p class="hint">These are priced per job by the subcontractor at quote time — enter the actual quote directly on the BOQ line in Cost Planner, not here.</p>
     <table class="item-table"><thead><tr><th>Item</th><th>Unit</th></tr></thead><tbody>${SUBCONTRACTOR_ITEMS.map(it=>`<tr><td>${it.p}</td><td>${it.u}</td></tr>`).join("")}</tbody></table>`);

  h += section("sec-rate-items", "Rate Items", "Rate Items — composite build-up factors (Concrete/Steel/Formwork sub-quantities per unit)", RATE_ITEMS.length,
    `<p class="hint">Concrete (m3), Steel (kg) and Formwork (m2) consumed per unit of each in-situ item, plus extra trade labour hours — these blend live with the rates above rather than being their own flat $ rate.</p>` +
    editableTable(RATE_ITEMS, state.rateItems, it=>it.p, [{field:"qtyC",label:"Concrete (m3/unit)"},{field:"qtyS",label:"Steel (kg/unit)"},{field:"qtyF",label:"Formwork (m2/unit)"},{field:"extraHrs",label:"Extra labour (hrs)"}], {mapName:"rateItems"}));

  h += section("sec-pt", "PT / Tendons", "PT (Post-Tensioned) Reinforcement &amp; Tendon Density — reference factors", PT_FACTORS.length,
    `<p class="hint">Reference-only estimating factors for PT slabs/beams — mild reinforcement (kg per m³) and PT tendon (kg per m²). Not yet wired into a live BOQ formula; use these as a quick cross-check when estimating a PT element.</p>` +
    editableTable(PT_FACTORS, state.ptFactors, it=>it.p, [{field:"reoKgM3",label:"Reinforcement (kg/m3)"},{field:"ptKgM2",label:"PT tendon (kg/m2)"}], {mapName:"ptFactors", showUnit:false}));

  h += section("sec-overheads", "Overheads & Margin", "Overheads, Margin &amp; Waste %", 3,
    `<table class="kv-table"><tbody>
      <tr><td>Overheads %</td><td><input type="number" step="any" id="g_overheads" value="${(state.global.overheadsPct*100).toFixed(1)}"></td></tr>
      <tr><td>Margin %</td><td><input type="number" step="any" id="g_margin" value="${(state.global.marginPct*100).toFixed(1)}"></td></tr>
      <tr><td>Subcontractor margin %</td><td><input type="number" step="any" id="g_subbiemargin" value="${(state.global.subbieMarginPct*100).toFixed(1)}"></td></tr>
    </tbody></table>`);

  h += section("sec-bci", "BCI Reference", "BCI Reference Rates — Melbourne (non-structural: excavation, roofing, fencing, paving, finishes)", BCI_REFERENCE.length,
    `<p class="hint">No Gradcon-established equivalent for these — kept as the BCI/Rawlinsons Melbourne benchmark. No escalation applied.</p>
     <table class="item-table"><thead><tr><th>Category</th><th>Item</th><th>Unit</th><th>Rate ($)</th></tr></thead><tbody>${
       BCI_REFERENCE.map((row,i)=>{
         const [cat,item,unit] = row;
         return `<tr><td>${cat}</td><td>${item}</td><td>${unit}</td><td><input type="number" step="any" class="lib-input" data-map="bciRef" data-key="${i}" data-field="rate" value="${state.bciRef[i].rate}"></td></tr>`;
       }).join("")
     }</tbody></table>`, false);

  h += section("sec-escalation", "Escalation", "Escalation (off by default — Gradcon does not escalate rates)", 2,
    `<p class="hint">Gradcon's rates above are already current, real supplier figures — escalation stays at 0% by design. Only touch this for a specific tender that genuinely needs a forward escalation allowance.</p>
     <table class="kv-table"><tbody>
       <tr><td>2025 escalation %</td><td><input type="number" step="any" id="g_esc25" value="${(state.global.escalation2025Pct*100).toFixed(1)}"></td></tr>
       <tr><td>2026 escalation %</td><td><input type="number" step="any" id="g_esc26" value="${(state.global.escalation2026Pct*100).toFixed(1)}"></td></tr>
     </tbody></table>`, false);

  const navHtml = `<nav class="lib-nav">` + navMeta.map(s=>`<button type="button" onclick="jumpTo('${s.id}')">${s.navLabel}</button>`).join("") + `</nav>`;
  document.getElementById("app").innerHTML = navHtml + `<div class="acc-grid">${h}</div>`;
  wireInputs();
}

function jumpTo(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.open = true;
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

function wireInputs(){
  document.querySelectorAll(".lib-input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const v = parseFloat(e.target.value);
      const mapPath = e.target.dataset.map.split(".");
      let target = state;
      mapPath.forEach(p=> target = target[p]);
      const key = e.target.dataset.key, field = e.target.dataset.field;
      const val = isNaN(v)?0:(e.target.dataset.pct?v/100:v);
      if(field==="_") target[key] = val; else target[key][field] = val;
      saveRates();
    });
  });
  // Editing a "unit rate" column (see UNIT_RATE_INFO) writes back to the SAME Base Rate
  // cell the .lib-input handler above edits — just via the inverse conversion, so either
  // field stays a valid way to change the one real established rate.
  document.querySelectorAll(".lib-unit-rate-input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const v = parseFloat(e.target.value);
      if(isNaN(v)) return;
      const mapPath = e.target.dataset.map.split(".");
      let target = state;
      mapPath.forEach(p=> target = target[p]);
      const key = e.target.dataset.key;
      const w = parseFloat(e.target.dataset.w);
      const info = UNIT_RATE_INFO[e.target.dataset.group];
      target[key] = info.toBase(v, w);
      saveRates();
    });
  });
  // Stock Bar's extra "$/tonne" column (see STOCK_BAR_TONNE_INFO above) — same idea as
  // the unit-rate handler above, just always Stock Bar so no data-group lookup needed.
  document.querySelectorAll(".lib-tonne-rate-input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const v = parseFloat(e.target.value);
      if(isNaN(v)) return;
      const mapPath = e.target.dataset.map.split(".");
      let target = state;
      mapPath.forEach(p=> target = target[p]);
      const key = e.target.dataset.key;
      const w = parseFloat(e.target.dataset.w);
      target[key] = STOCK_BAR_TONNE_INFO.toBase(v, w);
      saveRates();
    });
  });
  const bind = (id, path, pct)=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener("input", e=>{
      const v = parseFloat(e.target.value)||0;
      let target = state; for(let i=0;i<path.length-1;i++) target = target[path[i]];
      target[path[path.length-1]] = pct? v/100 : v;
      saveRates();
    });
  };
  bind("surcharge", ["global","concreteSurchargePerM3"]);
  bind("g_reodelivery", ["global","reinforcementDeliveryPerTonne"]);
  bind("g_reowaste", ["global","reoWastePct"]);
  bind("g_barlap", ["global","barLapPct"]);
  bind("g_meshlap", ["global","meshLapPct"]);
  bind("g_formwaste", ["global","formworkWastePct"]);
  bind("cl_placing", ["concreteLabour","placingHrsPerM3"]);
  bind("cl_finishing", ["concreteLabour","finishingHrsPerM3"]);
  bind("cl_curing", ["concreteLabour","curingRate"]);
  bind("cl_testing", ["concreteLabour","testingRate"]);
  bind("g_steelfixer", ["global","labourSteelFixer"]);
  bind("g_concreter", ["global","labourConcreter"]);
  bind("g_formworker", ["global","labourFormworker"]);
  bind("g_general", ["global","labourGeneral"]);
  bind("g_overheads", ["global","overheadsPct"], true);
  bind("g_margin", ["global","marginPct"], true);
  bind("g_subbiemargin", ["global","subbieMarginPct"], true);
  bind("g_esc25", ["global","escalation2025Pct"], true);
  bind("g_esc26", ["global","escalation2026Pct"], true);
}

renderApp(); // instant render from local/default state, no wait on the network
document.getElementById("saveBtn").addEventListener("click", saveRates);
syncFromCloud(); // then pull whatever another device last saved (or seed the cloud if this is the very first save anywhere)
window.addEventListener("focus", syncFromCloud);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncFromCloud(); });
setInterval(syncFromCloud, 6000); // close to live without a WebSocket subscription
</script>
